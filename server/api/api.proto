syntax = "proto3";

import "google/api/annotations.proto";

package api;

option go_package = "github.com/alexschoenwitz/mask-invaders/api";

service Server {
  rpc GetState(GetStateRequest) returns (GetStateResponse) {
    option (google.api.http) = {
      get: "/v1/state"
    };
  }
  rpc PostAction(PostActionRequest) returns (PostActionResponse) {
    option (google.api.http) = {
      post: "/v1/action"
      body: "*"
    };
  }

  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/register"
      body: "*"
    };
  }
}

message GetStateRequest {}

message GetStateResponse {
  State state = 1;
}

message State {
  map<string, City> cities = 1;
  repeated Movement movements = 2;
  repeated Distance distances = 3;
}

message City {
  string player = 1;
  map<string, int64> troops = 2;
}

message Movement {
  string edge = 1;
  map<string, int64> troops = 2;
  int64 arriving_turn = 3;
}

message Distance {
  string edge = 1;
  int64 distance = 2;
}

message PostActionRequest {
  Action action = 1;
}

message PostActionResponse {}

message Action {
  string from = 1;
  string to = 2;
  map<string, int64> troops = 3;
}

message RegisterRequest {
  string name = 1;
}

message RegisterResponse {
  string token = 1;
}
