<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mask Invaders - Web UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            margin: 20px auto;
        }

        canvas {
            border: 2px solid #16213e;
            background: #0f3460;
            display: block;
            cursor: pointer;
        }

        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #status {
            font-size: 14px;
            margin-bottom: 5px;
        }

        #messages {
            margin-top: 10px;
            font-weight: bold;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #51cf66;
        }

        #login-panel {
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin: 50px auto;
            max-width: 400px;
        }

        #login-panel h1 {
            margin-bottom: 20px;
            color: #4ecca3;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #0f3460;
            border: 1px solid #4ecca3;
            border-radius: 5px;
            color: white;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4ecca3;
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #3db88f;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Login Panel -->
    <div id="login-panel">
        <h1>🎮 Mask Invaders</h1>
        <div class="form-group">
            <label for="player-name">Player Name</label>
            <input type="text" id="player-name" placeholder="Enter your name" value="Player1">
        </div>
        <div class="form-group">
            <label for="api-url">Server URL</label>
            <input type="text" id="api-url" placeholder="http://localhost:8080" value="http://localhost:8080">
        </div>
        <button id="join-btn">Join Game</button>
        <div id="login-message" style="margin-top: 15px; text-align: center;"></div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="hidden">
        <canvas id="game-canvas" width="800" height="800"></canvas>
        <div id="ui-overlay">
            <div id="status"></div>
            <div id="messages"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
